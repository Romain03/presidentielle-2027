name: Veille des sources

# La veille tourne seule ; elle ne publie rien. Elle ouvre un ticket quand
# quelque chose demande une lecture humaine : une investiture, un retrait, un
# résultat de scrutin, un programme paru, une page citée réécrite, un lien mort.
# Écrire une proposition ou changer un statut suppose d'avoir lu l'article, et
# c'est précisément ce qui ne doit pas être automatisé.
on:
  schedule:
    # Deux fois par jour, 6 h et 18 h UTC.
    #
    # L'hebdomadaire ne suffisait pas : le 11 octobre 2026, le résultat de la
    # primaire du pôle socialiste a été proclamé un dimanche à 18 h 23 heure de
    # Paris, et le site serait resté faux jusqu'au lundi matin suivant - cinq
    # candidatures affichées comme déclarées alors qu'une seule restait en
    # course. Une campagne produit des annonces tous les jours, souvent en fin
    # de journée : le passage de 18 h UTC les voit le soir même.
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  surveiller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Le script sort en code 1 quand quelque chose demande une action : on
      # récupère ce code sans faire échouer le job, qui a encore du travail.
      - id: veille
        run: |
          set +e
          npm run veille --silent -- --ecrire > rapport.md 2> empreintes.log
          echo "action=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat empreintes.log || true
          cat rapport.md

      # Les empreintes sont la mémoire de la veille : sans elles, la même page
      # serait signalée comme « modifiée » à chaque exécution. Elles vivent hors
      # de /data pour ne pas polluer le journal des données, qui se construit
      # sur l'historique Git de ce dossier.
      - name: Mémoriser les empreintes
        run: |
          if [ -n "$(git status --porcelain veille/)" ]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add veille/
            git commit -m '[veille] empreintes des pages surveillées'
            git push
          else
            echo 'Aucune empreinte modifiée.'
          fi

      - name: Ouvrir ou compléter le ticket de veille
        if: steps.veille.outputs.action != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titre='Veille des sources : éléments à vérifier'
          numero=$(gh issue list --state open --search "$titre in:title" \
                     --json number --jq '.[0].number // empty')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file rapport.md
          else
            gh issue create --title "$titre" --body-file rapport.md
          fi
