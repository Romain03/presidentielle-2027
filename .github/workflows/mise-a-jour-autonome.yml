name: Mise à jour autonome

# Lance Claude Code dans le dépôt pour appliquer le protocole de
# PROTOCOLE_AUTONOME.md : lire le rapport de veille, vérifier les annonces
# auprès de deux rédactions, et corriger les données quand c'est établi.
#
# Il tourne après la veille, qui passe à 6 h et 18 h UTC : le résultat d'une
# annonce de fin de journée est donc traité le soir même.
#
# Pour l'activer, un seul secret à créer dans Settings > Secrets and variables >
# Actions : ANTHROPIC_API_KEY. Sans lui, le job s'arrête proprement en le disant,
# et la veille continue de fonctionner seule.
on:
  schedule:
    - cron: '41 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mise-a-jour-autonome
  cancel-in-progress: false

jobs:
  mettre-a-jour:
    runs-on: ubuntu-latest
    # L'action n'expose pas de garde-temps : il est posé sur le job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: cle
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo 'presente=oui' >> "$GITHUB_OUTPUT"
          else
            echo 'presente=non' >> "$GITHUB_OUTPUT"
            echo '::notice::ANTHROPIC_API_KEY absent : la mise à jour autonome est inactive. La veille, elle, continue.'
          fi

      - name: Appliquer le protocole
        if: steps.cle.outputs.presente == 'oui'
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Les outils passent par claude_args : l'action n'expose pas d'entrée
          # allowed_tools, et un nom d'entrée inconnu est ignoré en silence.
          # Lire les articles demande le réseau, valider demande npm, committer
          # demande Git ; rien d'autre n'est accordé.
          claude_args: >-
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
          prompt: |
            Tu travailles dans le dépôt presidentielle-2027, sur un site public
            consacré à l'élection présidentielle française de 2027.

            Lis PROTOCOLE_AUTONOME.md et applique-le à la lettre. Il décrit le
            cycle à suivre, ce que tu peux modifier seul, ce que tu ne dois
            jamais modifier, le test de véracité à appliquer avant tout
            changement de statut, et les pièges déjà rencontrés.

            Deux règles au-dessus de toutes les autres :

            1. En cas de doute, ne change rien dans data/ et consigne-le dans
               DONNEES_A_VERIFIER.md. Une donnée manquante est un défaut connu ;
               une donnée fausse est une fausse information sur une candidature
               réelle.
            2. Ne pousse rien si npm test échoue.

            Termine par le compte rendu décrit au §6 du protocole, en commentaire
            du ticket GitHub intitulé « Veille des sources : éléments à
            vérifier » (crée-le s'il n'existe pas). Écris ce que tu as écarté
            autant que ce que tu as appliqué.
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Signaler un échec
        if: failure() && steps.cle.outputs.presente == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$(gh issue list --state open \
            --search 'Veille des sources : éléments à vérifier in:title' \
            --json number --jq '.[0].number')" \
            --body "La mise à jour autonome du $(date -u +%d/%m/%Y) a échoué. Les données n'ont pas été modifiées. Journal : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
